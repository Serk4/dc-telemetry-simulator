apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: telemetry-generator
        static_configs:
          - targets:
              - telemetry-generator.telemetry.svc.cluster.local:80
        metrics_path: /metrics
        scrape_interval: 10s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  rack-alerts.yml: |
    groups:
      - name: rack-temperature
        rules:
          - alert: RackTemperatureHigh
            expr: dc_rack_temperature_celsius > 80
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Rack {{ $labels.rack_id }} temperature is {{ $value | humanize }}°C"
              description: "Rack temperature has exceeded 80°C for more than 1 minute."
          - alert: RackTemperatureCritical
            expr: dc_rack_temperature_celsius > 90
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "CRITICAL: Rack {{ $labels.rack_id }} temperature is {{ $value | humanize }}°C"
              description: "Rack temperature has exceeded 90°C. Immediate action required."
          - alert: NodeDegraded
            expr: dc_rack_node_healthy == 0
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Node in {{ $labels.rack_id }} is degraded"
              description: "A node in rack {{ $labels.rack_id }} has been reporting unhealthy."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP

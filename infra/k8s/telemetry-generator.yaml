apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-generator
  namespace: telemetry
  labels:
    app: telemetry-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-generator
  template:
    metadata:
      labels:
        app: telemetry-generator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: telemetry-generator
          image: telemetry-generator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Simulator__RackCount
              value: "4"
            - name: Simulator__IntervalMs
              value: "5000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-generator
  namespace: telemetry
  labels:
    app: telemetry-generator
spec:
  selector:
    app: telemetry-generator
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
